<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Gênero</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --secondary-color: #6b7280;
            --secondary-hover: #4b5563;
            --border-color: #e5e7eb;
            --input-focus: #fcd34d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--warning-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-block;
            text-align: center;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background-color: var(--warning-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--warning-hover);
        }

        .btn-back {
            background-color: #f3f4f6;
            color: var(--secondary-color);
            border: 1px solid var(--border-color);
        }

        .btn-back:hover {
            background-color: #e5e7eb;
            color: var(--secondary-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Alterar Gênero</h1>

        <form action="/generos/alterar" method="post">
            <input type="hidden" name="id" value="{{genero.id}}">

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" value="{{genero.nome}}" required>
            </div>

           
            <div class="actions">
                <a href="/generos/" class="btn btn-back">Voltar</a>
                <button type="submit" class="btn btn-submit">Salvar Alterações</button>
            </div>
        </form>
    </div>
</body>

</html>
