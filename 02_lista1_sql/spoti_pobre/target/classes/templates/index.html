<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        ul.user-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }

        ul.user-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #fff;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        ul.user-list li:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .user-name {
            font-weight: 500;
            font-size: 1rem;
            color: #374151;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-block;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-edit {
            background-color: var(--warning-color);
            color: white;
        }

        .btn-edit:hover {
            background-color: var(--warning-hover);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Lista de Usuários</h1>

        <ul class="user-list">
            {{#vetUsuario}}
            <li>
                <span class="user-name">{{nome}}</span>
                <div class="actions">
                    <a href="/usuarios/tela_alterar/{{id}}" class="btn btn-edit">Alterar</a>
                    <a href="/usuarios/excluir/{{id}}" class="btn btn-delete">Excluir</a>
                </div>
            </li>
            {{/vetUsuario}}
        </ul>

        <a href="/usuarios/tela_adicionar" class="btn btn-add">+ Adicionar Usuário</a>
    </div>
</body>

</html>
