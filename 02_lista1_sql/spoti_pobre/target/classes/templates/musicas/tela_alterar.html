<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Músicas</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #6b7280;
            --secondary-hover: #4b5563;
            --border-color: #e5e7eb;
            --input-focus: #818cf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-block;
            text-align: center;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-back {
            background-color: #f3f4f6;
            color: var(--secondary-color);
            border: 1px solid var(--border-color);
        }

        .btn-back:hover {
            background-color: #e5e7eb;
            color: var(--secondary-hover);
        }
    </style>

    <script>
        function verifica(input_file) {
            if (input_file.value != null) {
                document.getElementById("maroto").checked = false;
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Alterar Músicas</h1>

        <form action="/musicas/alterar" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="id" value="{{musica.id}}">

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite nome" required value="{{musica.nome}}">
            </div>

            <div class="form-group">
                <label for="capa">Arquivo </label>
                 {{#musica.arquivoEncode}}
                <input id="maroto" type="checkbox" name="manter_arquivo" value="true" checked>Deseja manter arquivo original?

                                  <audio controls src="data:{{musica.materialTipo}};base64,{{musica.arquivoEncode}}"></audio>

            {{/musica.arquivoEncode}}

            <!-- {{^musica.arquivoEncode}}

                <div class="musica-cover-placeholder">
                    Sem capa
                </div>

            {{/musica.arquivoEncode}} -->
               
                <input onchange="verifica(this)" type="file" id="capa" name="arquivo" placeholder="Selecione um arquivo">
            </div>

            <div class="form-group">
                <label for="Data Lancamento">Data Lancamento</label>
                <input type="datetime-local" id="data" name="data_hora_lancamento" required value="{{musica.dataHoraLancamento}}">
            </div>


    <div class="form-group">
                <label for="Duração">Duração</label>
                <input type="time" id="duracao" name="duracao" step="1" value="02:30:15" lang="pt-BR" value="{{musica.duracao}}">
            </div>
           
          
            <div class="actions">
                <a href="/musicas/" class="btn btn-back">Voltar</a>
                <button type="submit" class="btn btn-submit">Alterar</button>
            </div>
        </form>
    </div>
</body>

</html>
